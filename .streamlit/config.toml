[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
# serves dashboard/static/ (bundled map shapes, so the choropleth works offline)
enableStaticServing = true

[browser]
gatherUsageStats = false
